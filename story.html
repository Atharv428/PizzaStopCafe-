<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Story - Pizza Stop Alephata | Made with Love, Served with Passion</title>

  <!-- SEO Optimization Meta Tags -->
  <meta name="description"
    content="Discover the story of Pizza Stop Alephata along the Pune-Nashik Highway. Made with love and served with passion, bringing friends, families, and food lovers together over artisan pizzas, fresh ingredients, and genuine hospitality.">
  <meta name="theme-color" content="#163B2B">

  <!-- Manifest & Favicon -->
  <link rel="icon" type="image/jpeg" href="./Logo/logo.jpeg">

  <!-- Google Fonts: Cinzel, Playfair Display & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Tailwind CSS v3 Play CDN (Preflight disabled to protect existing design) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      corePlugins: {
        preflight: false, // Preserves custom design and reset rules without any overrides
      },
      theme: {
        extend: {
          colors: {
            leaf: 'var(--c-leaf)',
            forest: 'var(--c-forest)',
            jungle: 'var(--c-jungle)',
            gold: 'var(--c-gold)',
            cream: 'var(--c-cream)',
            yellowAccent: '#FEF08A',
            yellowWarm: '#FEF3C7',
            yellowBorder: '#EAB308',
            amberDark: '#92400E',
          },
          fontFamily: {
            serif: ['Playfair Display', 'Georgia', 'serif'],
            sans: ['Plus Jakarta Sans', '-apple-system', 'sans-serif'],
            brand: ['Cinzel', 'serif'],
          },
        },
      },
    };
  </script>

  <!-- Dedicated Cafe Story Modular Master Stylesheet -->
  <link rel="stylesheet" href="./css/story.css?v=18">

  <!-- Immediate Theme Loader (prevents flash of incorrect theme) -->
  <script>
    (function () {
      const valid = ['cyan-purple', 'orange-cream', 'lime-violet'];
      const saved = localStorage.getItem('pizzastop_theme');
      const theme = valid.includes(saved) ? saved : 'cyan-purple';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <!-- React 18 & ReactDOM 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- In-Browser Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
  <!-- React Mount Point -->
  <div id="root"></div>

  <!-- Distributed React Components -->
  <script type="text/babel" src="./js/components/TopNav.jsx"></script>
  <script type="text/babel" src="./js/components/HeroSection.jsx"></script>
  <script type="text/babel" src="./js/components/StoryIntro.jsx"></script>
  <script type="text/babel" src="./js/components/VideoSection.jsx"></script>
  <script type="text/babel" src="./js/components/AmbianceSection.jsx"></script>
  <script type="text/babel" src="./js/components/MemoryWall.jsx"></script>
  <script type="text/babel" src="./js/components/Footer.jsx"></script>

  <!-- Main React App Entrypoint -->
  <script type="text/babel" src="./js/App.jsx"></script>
</body>

</html>
